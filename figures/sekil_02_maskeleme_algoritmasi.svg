<svg xmlns="http://www.w3.org/2000/svg" width="900" height="552" viewBox="0 0 900 552" role="img"><title>Akciger-odakli maskeleme ve ilgi alani cikarim algoritmasinin adimlari, geri cekilme dali ve on-isleme parametreleri.</title><rect width="900" height="552" fill="#FFFFFF"/><defs><marker id="mke2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6E7A80" /></marker><marker id="mka2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#17616B" /></marker><marker id="mkb2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#96421F" /></marker></defs><rect x="110" y="30" width="360" height="54" rx="2.5" fill="#FFFFFF" stroke="#7C888E" stroke-width="1.1" /><text x="290.0" y="47.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2327" text-anchor="middle">1 · Görüntü yükleme</text><text x="290.0" y="63.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">PNG / JPG / DICOM (MONOCHROME1 ters çevrilir)</text><text x="290.0" y="76.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">kısa kenar &gt; 512 px ise oranı koruyarak ölçekle</text><rect x="110" y="102" width="360" height="54" rx="2.5" fill="#FFFFFF" stroke="#7C888E" stroke-width="1.1" /><text x="290.0" y="119.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2327" text-anchor="middle">2 · Anatomik segmentasyon</text><text x="290.0" y="135.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">ianpan U-Net → argmax → M = {sınıf 1, sınıf 2}</text><text x="290.0" y="148.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">sınıf 3 (kalp ve mediasten) dışlanır</text><polygon points="290,168 390,200 290,232 190,200" fill="#FFFFFF" stroke="#7C888E" stroke-width="1.1" /><text x="290" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2327" text-anchor="middle">Maske boş mu?</text><text x="290" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">toplam(M) &lt; 1</text><rect x="110" y="250" width="360" height="54" rx="2.5" fill="#FFFFFF" stroke="#7C888E" stroke-width="1.1" /><text x="290.0" y="267.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2327" text-anchor="middle">3 · Tolerans katmanı</text><text x="290.0" y="283.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">dilatasyon: elips, r = 0,025 × kısa kenar</text><text x="290.0" y="296.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">kenar yumuşatma: Gauss 9 × 9 → soft ∈ [0, 1]</text><rect x="110" y="322" width="360" height="54" rx="2.5" fill="#FFFFFF" stroke="#7C888E" stroke-width="1.1" /><text x="290.0" y="339.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2327" text-anchor="middle">4 · Kompozit</text><text x="290.0" y="355.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">I′ = I · soft + dolgu · (1 − soft)</text><text x="290.0" y="368.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">dolgu = veri kümesi ortalama grisi (122)</text><rect x="110" y="394" width="360" height="54" rx="2.5" fill="#FFFFFF" stroke="#7C888E" stroke-width="1.1" /><text x="290.0" y="411.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2327" text-anchor="middle">5 · İlgi alanı</text><text x="290.0" y="427.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">sınır kutusu + %5 pay → kareye tamamla</text><text x="290.0" y="440.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">görüntü sınırına sığdır</text><rect x="110" y="466" width="360" height="54" rx="2.5" fill="#DDEBED" stroke="#17616B" stroke-width="1.6" /><text x="290.0" y="490.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2327" text-anchor="middle">6 · Ölçekleme ve normalizasyon</text><text x="290.0" y="505.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">224 × 224 (INTER_AREA) → ViT-B/16 girdisi</text><path d="M 290 84 L 290 102" fill="none" stroke="#6E7A80" stroke-width="1.3" marker-end="url(#mke2)" /><path d="M 290 156 L 290 168" fill="none" stroke="#6E7A80" stroke-width="1.3" marker-end="url(#mke2)" /><path d="M 290 232 L 290 250" fill="none" stroke="#6E7A80" stroke-width="1.3" marker-end="url(#mke2)" /><text x="302" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5A686F" text-anchor="start">hayır</text><path d="M 290 304 L 290 322" fill="none" stroke="#6E7A80" stroke-width="1.3" marker-end="url(#mke2)" /><path d="M 290 376 L 290 394" fill="none" stroke="#6E7A80" stroke-width="1.3" marker-end="url(#mke2)" /><path d="M 290 448 L 290 466" fill="none" stroke="#17616B" stroke-width="1.6" marker-end="url(#mka2)" /><rect x="520" y="173" width="190" height="54" rx="2.5" fill="#F4E5DC" stroke="#96421F" stroke-width="1.3" stroke-dasharray="5 3" /><text x="615.0" y="190.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2327" text-anchor="middle">Geri çekilme</text><text x="615.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">224'e ölçekle, used = False</text><text x="615.0" y="219.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="middle">koşum: 0 / 10.128 görüntü</text><path d="M 390 200 L 518 200" fill="none" stroke="#96421F" stroke-width="1.4" marker-end="url(#mkb2)" /><text x="454" y="193" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5A686F" text-anchor="middle">evet</text><path d="M 615 227 L 615 247 L 500 247 L 500 493 L 472 493" fill="none" stroke="#96421F" stroke-width="1.4" marker-end="url(#mkb2)" /><rect x="560" y="254" width="320" height="228" rx="2.5" fill="#F4F6F7" stroke="#D8DFE1" stroke-width="1.0" /><text x="578" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2327" text-anchor="start">Ön-işleme parametreleri</text><path d="M 578 288 L 862 288" fill="none" stroke="#A9B4B8" stroke-width="0.8" /><text x="578" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="start">Kısa kenar üst sınırı</text><text x="862" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B2327" font-variant-numeric="tabular-nums" text-anchor="end">512 px</text><text x="578" y="331" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="start">Maske genişletme</text><text x="862" y="331" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B2327" font-variant-numeric="tabular-nums" text-anchor="end">0,025 × kısa kenar</text><text x="578" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="start">Kenar yumuşatma (Gauss)</text><text x="862" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B2327" font-variant-numeric="tabular-nums" text-anchor="end">9 × 9</text><text x="578" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="start">Akciğer dışı dolgu</text><text x="862" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B2327" font-variant-numeric="tabular-nums" text-anchor="end">122 (ort. gri)</text><text x="578" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="start">İlgi alanı güvenlik payı</text><text x="862" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B2327" font-variant-numeric="tabular-nums" text-anchor="end">0,05 × kısa kenar</text><text x="578" y="415" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="start">Çıktı çözünürlüğü</text><text x="862" y="415" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B2327" font-variant-numeric="tabular-nums" text-anchor="end">224 × 224 × 3</text><text x="578" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="start">Normalizasyon</text><text x="862" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B2327" font-variant-numeric="tabular-nums" text-anchor="end">0,4769 / 0,2414</text><text x="578" y="457" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5A686F" text-anchor="start">Geri çekilme oranı</text><text x="862" y="457" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1B2327" font-variant-numeric="tabular-nums" text-anchor="end">0 / 10.128</text></svg>